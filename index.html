<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngorongoro</title>
<meta name="description" content="A quiet journey into the Ngorongoro Crater - the rim, the animal floor, the flamingo lake, and the Maasai night.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 10 Q16 26 28 10 L28 28 L4 28 Z' fill='%237c9159'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/patrick-hand.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="crater" aria-label="A living scene of the Ngorongoro Crater. Drag slowly to look around."></canvas>

<div id="veil" aria-hidden="true">
  <h1 class="wordmark">Ngorongoro</h1>
</div>

<button id="hint" class="hint" type="button" aria-label="Show controls">
  <svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M10.2 6.4 C7.6 8.6 7.8 15.6 10.6 20.4 C11.8 22.4 14.2 22 14.4 19.4 C14.8 14.6 13.6 8 10.2 6.4 Z"/><path d="M21.8 6.4 C24.4 8.6 24.2 15.6 21.4 20.4 C20.2 22.4 17.8 22 17.6 19.4 C17.2 14.6 18.4 8 21.8 6.4 Z"/><path d="M12.4 26.4 L19.8 26.6"/></svg>
</button>

<header id="masthead" class="chrome">
  <span class="wordmark-small">Ngorongoro</span>
</header>

<div id="orbs" class="chrome">
  <button id="audio-orb" class="orb" aria-pressed="false" aria-label="Crater sounds, off">
    <svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path class="spk" d="M5.4 12.4 L10.6 12.2 L16.6 7.2 L16.8 24.8 L10.4 19.8 L5.6 19.6 Z"/><path class="wav" d="M21 12 C23.2 14.2 23.2 17.8 21 20"/><path class="wav" d="M24.4 8.6 C28 12.4 28 19.6 24.4 23.4"/></svg>
  </button>
  <button id="reset-orb" class="orb" hidden aria-label="Return to this view">
    <svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.4 L18.4 13.4 L28.6 16 L18.4 18.6 L16 28.6 L13.6 18.6 L3.4 16 L13.6 13.4 Z"/><circle cx="16" cy="16" r="1.5"/></svg>
  </button>
  <button id="pin-controls" class="orb" type="button" aria-pressed="false" aria-label="Keep controls visible" title="Keep controls visible">
    <svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 4.4 L23 5.2 L19.6 10.4 L23 15.4 L16.8 15.6 L16.6 29 L15.2 29 L15 15.4 L9.6 14.8 Z"/></svg>
  </button>
</div>

<div id="journey-text">
<p id="caption" role="status"></p>
<p id="whisper"></p>
</div>

<nav id="dock" class="chrome" aria-label="Faces of the crater">
  <svg class="route" viewBox="0 0 300 24" preserveAspectRatio="none" aria-hidden="true"><path d="M4 12 C40 5 62 19 100 11 S160 6 200 12 S262 18 296 9"/></svg>
  <button class="dot" data-scene="0" aria-label="The crater rim at dawn"><b><svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M3.6 24.6 L9.6 14.6 L13.6 19.4 L18.4 10.4 L23.2 18 L28.4 13.4 L28.6 24.8"/><circle cx="23.6" cy="7.2" r="2.6"/></svg></b><span>Rim</span></button>
  <button class="dot" data-scene="1" aria-label="The animal floor"><b><svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M9.6 7.4 C6.8 9.6 7.4 16.4 10.4 20.8 C11.6 22.6 13.8 22 14 19.6 C14.2 15 13 9 9.6 7.4 Z"/><path d="M21.6 9 C24.4 11 23.8 17.2 21.2 21 C20 22.6 18 22 17.8 19.8 C17.6 15.6 18.6 10.6 21.6 9 Z"/></svg></b><span>Floor</span></button>
  <button class="dot" data-scene="2" aria-label="The flamingo lake"><b><svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M20.6 5.8 C16 4.4 12.4 7.6 14.2 11.4 C15.6 14.4 21.2 14.4 21 19.6 L17.2 19.6 C13 19.8 13 14 17.6 13.8"/><path d="M18 19.8 L17.4 27.4 L20.4 27.6"/><path d="M4.6 28.6 C8 27.4 10 29.4 13.2 28.4"/><path d="M22.6 6 L25.8 6.6"/></svg></b><span>Lake</span></button>
  <button class="dot" data-scene="3" aria-label="The Maasai night on the rim"><b><svg class="ink-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M20.6 5 C13 5.8 9.4 13.6 12.6 20.2 C15.8 26.6 24.4 25.2 27 19 C22.4 20.4 17.6 16.6 20.6 5 Z"/><path d="M6.4 8.4 L6.6 12.4 M4.4 10.4 L8.6 10.6"/></svg></b><span>Night</span></button>
</nav>

<script type="module" src="main.js"></script>
</body>
</html>
