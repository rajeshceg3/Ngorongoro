<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngorongoro</title>
<meta name="description" content="A quiet journey into the Ngorongoro Crater - the rim, the animal floor, the flamingo lake, and the Maasai night.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 10 Q16 26 28 10 L28 28 L4 28 Z' fill='%237c9159'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="crater" aria-label="A living scene of the Ngorongoro Crater. Drag slowly to look around."></canvas>

<div id="veil" aria-hidden="true">
  <h1 class="wordmark">Ngorongoro</h1>
</div>

<header id="masthead" class="chrome" aria-hidden="true">
  <span class="wordmark-small">Ngorongoro</span>
</header>

<div id="orbs">
  <button id="audio-orb" class="orb" aria-pressed="false" aria-label="Crater sounds, off">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wav" d="M16 9c1.2 1 1.2 5 0 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
  </button>
  <button id="reset-orb" class="orb" hidden aria-label="Return to this view">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="6.2" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg>
  </button>
</div>

<div id="journey-text">
<p id="caption" class="chrome" role="status"></p>
<p id="whisper" class="chrome"></p>

</div>

<nav id="dock" aria-label="Faces of the crater">
  <button class="dot" data-scene="0" aria-label="The crater rim at dawn"><i></i><span>Rim</span></button>
  <button class="dot" data-scene="1" aria-label="The animal floor"><i></i><span>Floor</span></button>
  <button class="dot" data-scene="2" aria-label="The flamingo lake"><i></i><span>Lake</span></button>
  <button class="dot" data-scene="3" aria-label="The Maasai night on the rim"><i></i><span>Night</span></button>
</nav>

<script type="module" src="main.js"></script>
</body>
</html>
